name: Release container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: monogatari-smoke:${{ github.sha }}
      - name: Smoke-test the built image with isolated data
        shell: bash
        run: |
          container=monogatari-smoke
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              echo "Smoke test failed; container diagnostics follow."
              docker ps -a
              docker logs "$container" || true
              docker inspect "$container" || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            exit "$result"
          }
          trap cleanup EXIT

          docker run -d --name "$container" \
            --tmpfs /data:rw,size=128m \
            -p 3000:3000 \
            monogatari-smoke:${{ github.sha }}

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)" != "true" ]; then
              echo "Container exited before the health check completed."
              exit 1
            fi
            sleep 2
          done
          exit 1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/monogatari
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
