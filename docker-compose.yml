services:
  monogatari:
    image: ghcr.io/${MONOGATARI_IMAGE_OWNER:-replace-me}/monogatari:${MONOGATARI_TAG:-edge}
    build:
      context: .
      args:
        MONOGATARI_VERSION: ${MONOGATARI_VERSION:-unknown}
        MONOGATARI_BUILD_TAG: ${MONOGATARI_BUILD_TAG:-edge}
        MONOGATARI_GIT_SHA: ${MONOGATARI_GIT_SHA:-unknown}
        MONOGATARI_BUILD_TIME: ${MONOGATARI_BUILD_TIME:-unknown}
    ports:
      - "${MONOGATARI_PORT:-3010}:3000"
    environment:
      MONOGATARI_DATA_DIR: /data
      NOTION_API_TOKEN: ${NOTION_API_TOKEN:-}
      MONOGATARI_MONITOR_TOKEN: ${MONOGATARI_MONITOR_TOKEN:-}
      MONOGATARI_TRUSTED_ORIGINS: ${MONOGATARI_TRUSTED_ORIGINS:-}
    volumes:
      - monogatari-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  monogatari-data:
